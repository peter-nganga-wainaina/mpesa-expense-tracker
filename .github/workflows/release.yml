# Publishes a signed APK as a GitHub Release when a version tag (v1.2.0) is pushed. The app's updater
# reads the newest release's version.txt and downloads its expense-tracker.apk, so both names are fixed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same JDK as Android Studio's bundled runtime, so CI builds the way local builds do.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # The keystore is stored as a base64 secret and only ever written to the runner's temp folder.
      - name: Restore the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Tests first: a release must never ship from a red build.
      - name: Test and build the signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      # Reads the version from the APK itself, so version.txt always describes the file next to it,
      # and refuses a tag that doesn't match versionName (e.g. a forgotten version bump).
      - name: Check the APK and write version.txt
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed APK; check the signing secrets"; exit 1; }
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          badging=$("$build_tools/aapt2" dump badging "$apk" | head -1)
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          name=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $name in app/build.gradle.kts"
            exit 1
          fi
          mkdir -p release
          cp "$apk" release/expense-tracker.apk
          printf 'versionCode=%s\nversionName=%s\n' "$code" "$name" > release/version.txt
          cat release/version.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/expense-tracker.apk release/version.txt \
            --title "$GITHUB_REF_NAME" --generate-notes --latest
